<div class="eu-overlay" (click)="onCancel()">
  <div class="eu-dialog" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="eu-header">
      <div class="eu-header-text">
        <h2 class="eu-title">{{ 'users.edit_title' | translate }}</h2>
        <p class="eu-subtitle">{{ user()?.username }}</p>
      </div>
      <button class="eu-close" type="button" (click)="onCancel()" [attr.aria-label]="'common.cancel' | translate">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Form body -->
    <div class="eu-body">

      <!-- Section: Identity -->
      <p class="eu-section-label">{{ 'users.section_identity' | translate }}</p>

      <div class="eu-field">
        <label class="eu-label" for="eu-username">{{ 'users.username' | translate }}</label>
        <input
          id="eu-username"
          class="eu-input"
          type="text"
          [ngModel]="editUsername()"
          (ngModelChange)="editUsername.set($event)"
          [placeholder]="'users.username' | translate"
          autocomplete="off"/>
      </div>

      <div class="eu-field">
        <label class="eu-label" for="eu-password">{{ 'users.password' | translate }}</label>
        <input
          id="eu-password"
          class="eu-input"
          type="password"
          [ngModel]="editPassword()"
          (ngModelChange)="editPassword.set($event)"
          [placeholder]="'users.password_placeholder' | translate"
          autocomplete="new-password"/>
        <p class="eu-help-text">{{ 'users.password_help' | translate }}</p>
      </div>

      <!-- Section: Name -->
      <p class="eu-section-label eu-section-gap">{{ 'users.section_name' | translate }}</p>

      <div class="eu-row">
        <div class="eu-field">
          <label class="eu-label" for="eu-firstname">{{ 'users.first_name' | translate }}</label>
          <input
            id="eu-firstname"
            class="eu-input"
            type="text"
            [ngModel]="editFirstName()"
            (ngModelChange)="editFirstName.set($event)"
            [placeholder]="'users.first_name' | translate"
            autocomplete="given-name"/>
        </div>

        <div class="eu-field">
          <label class="eu-label" for="eu-lastname">{{ 'users.last_name' | translate }}</label>
          <input
            id="eu-lastname"
            class="eu-input"
            type="text"
            [ngModel]="editLastName()"
            (ngModelChange)="editLastName.set($event)"
            [placeholder]="'users.last_name' | translate"
            autocomplete="family-name"/>
        </div>
      </div>

      @if (editError()) {
        <p class="eu-error">{{ editError() }}</p>
      }

    </div>

    <!-- Actions -->
    <div class="eu-actions">
      <button class="eu-btn-ghost" type="button" (click)="onCancel()">{{ 'common.cancel' | translate }}</button>
      <button class="eu-btn-primary" type="button"
        [disabled]="editLoading() || !editUsername().trim()"
        (click)="confirmEditUser()">
        @if (editLoading()) { {{ 'common.saving' | translate }} } @else { {{ 'common.save' | translate }} }
      </button>
    </div>

  </div>
</div>
