<div class="dialog-overlay" (click)="onCancel()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h2 class="dialog-title">{{ 'create_user.title' | translate }}</h2>
      <button class="dialog-close" type="button" (click)="onCancel()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="dialog-form">
      <div class="avatar-row">
        <div class="avatar-wrap">
          @if (avatarPreviewUrl()) {
            <img class="avatar-img" [src]="avatarPreviewUrl()!" alt="avatar preview"/>
          } @else {
            <div class="avatar-fallback">{{ avatarInitial() }}</div>
          }
          <label class="avatar-edit-btn" [title]="'users.edit' | translate">
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
              <path d="M2 12h10M9.5 2.5l2 2-6 6H3.5V9l6-6.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input type="file" accept="image/*" (change)="onAvatarChange($event)" style="display:none"/>
          </label>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="d-username">{{ 'create_user.username' | translate }}</label>
        <input id="d-username" class="field-input" type="text" formControlName="username" placeholder="e.g. john_doe" autocomplete="off"/>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="field-label" for="d-firstname">{{ 'create_user.first_name' | translate }}</label>
          <input id="d-firstname" class="field-input" type="text" formControlName="firstName" [placeholder]="'create_user.first_name' | translate" autocomplete="off"/>
        </div>
        <div class="field">
          <label class="field-label" for="d-lastname">{{ 'create_user.last_name' | translate }}</label>
          <input id="d-lastname" class="field-input" type="text" formControlName="lastName" [placeholder]="'create_user.last_name' | translate" autocomplete="off"/>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="d-email">{{ 'create_user.email' | translate }}</label>
        <input id="d-email" class="field-input" type="email" formControlName="email" placeholder="e.g. john@example.com" autocomplete="off"/>
      </div>

      <div class="field">
        <label class="field-label" for="d-password">{{ 'create_user.password' | translate }}</label>
        <input id="d-password" class="field-input" type="password" formControlName="temporaryPassword" [placeholder]="'common.min8' | translate" autocomplete="new-password"/>
      </div>

      <div class="field">
        <label class="field-label" for="d-role">{{ 'create_user.role' | translate }}</label>
        <select id="d-role" class="field-input" formControlName="role">
          <option value="USER">User</option>
          <option value="MODERATOR">Moderator</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      @if (error()) {
        <p class="error-message">{{ error() }}</p>
      }

      <div class="dialog-actions">
        <button class="btn-ghost" type="button" (click)="onCancel()">{{ 'create_user.cancel' | translate }}</button>
        <button class="btn-primary" type="submit" [disabled]="loading()">
          @if (loading()) { {{ 'create_user.creating' | translate }} } @else { {{ 'create_user.submit' | translate }} }
        </button>
      </div>
    </form>
  </div>
</div>

@if (showCropper()) {
  <app-image-cropper-dialog
    [imageChangedEvent]="imageChangedEvent()"
    (cropped)="onImageCropped($event)"
    (cancelled)="onCropperCancelled()">
  </app-image-cropper-dialog>
}
