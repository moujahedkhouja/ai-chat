<div class="input-wrap">
  <div class="input-card" [class.input-card--focus]="isFocused()">

    <!-- Rich-mode toolbar -->
    @if (richMode()) {
      <div class="toolbar">
        <div class="toolbar-group">
          <!-- Bold -->
          <button type="button" class="tool-btn" (click)="applyFormat('bold')" title="Bold" [disabled]="previewMode()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M3.5 2h4.25a2.75 2.75 0 0 1 0 5.5H3.5V2Z" fill="currentColor"/>
              <path d="M3.5 7.5h4.75a2.75 2.75 0 0 1 0 5.5H3.5V7.5Z" fill="currentColor"/>
            </svg>
          </button>
          <!-- Italic -->
          <button type="button" class="tool-btn" (click)="applyFormat('italic')" title="Italic" [disabled]="previewMode()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <line x1="9" y1="1.5" x2="5" y2="12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <line x1="11.5" y1="1.5" x2="6.5" y2="1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <line x1="7.5" y1="12.5" x2="2.5" y2="12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <!-- Inline Code -->
          <button type="button" class="tool-btn" (click)="applyFormat('code')" title="Inline code" [disabled]="previewMode()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M4.5 3.5L1 7l3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9.5 3.5L13 7l-3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <!-- Quote -->
          <button type="button" class="tool-btn" (click)="applyFormat('quote')" title="Blockquote" [disabled]="previewMode()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="1.5" y="2" width="2.5" height="10" rx="1.25" fill="currentColor" opacity="0.5"/>
              <path d="M5.5 4.5h7M5.5 7h7M5.5 9.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
          <!-- Unordered list -->
          <button type="button" class="tool-btn" (click)="applyFormat('ul')" title="Bullet list" [disabled]="previewMode()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="2" cy="3.5" r="1.2" fill="currentColor"/>
              <circle cx="2" cy="7" r="1.2" fill="currentColor"/>
              <circle cx="2" cy="10.5" r="1.2" fill="currentColor"/>
              <path d="M5 3.5h7M5 7h7M5 10.5h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <!-- Heading -->
          <button type="button" class="tool-btn" (click)="applyFormat('h2')" title="Heading 2" [disabled]="previewMode()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M1.5 2.5v9M7.5 2.5v9M1.5 7h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M9.5 10.5c0-2 3.5-2 3.5-4a1.75 1.75 0 0 0-3.5 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <!-- Link -->
          <button type="button" class="tool-btn" (click)="applyFormat('link')" title="Insert link" [disabled]="previewMode()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M6 8a3.535 3.535 0 0 0 5 0l1.5-1.5a3.536 3.536 0 0 0-5-5L6 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M8 6a3.535 3.535 0 0 0-5 0L1.5 7.5a3.536 3.536 0 0 0 5 5L8 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="toolbar-spacer"></div>

        <!-- Preview toggle -->
        <button type="button" class="tool-btn tool-btn--preview" (click)="togglePreview()" [title]="previewMode() ? 'Edit' : 'Preview'">
          @if (previewMode()) {
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M1.5 7S3.5 2.5 7 2.5 12.5 7 12.5 7 10.5 11.5 7 11.5 1.5 7 1.5 7Z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="7" cy="7" r="2" fill="currentColor"/>
            </svg>
            <span>Edit</span>
          } @else {
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M1.5 7S3.5 2.5 7 2.5 12.5 7 12.5 7 10.5 11.5 7 11.5 1.5 7 1.5 7Z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span>Preview</span>
          }
        </button>
      </div>
    }

    <!-- Input area -->
    <div class="input-row">
      <!-- Mode toggle pill -->
      <button type="button" class="mode-btn" (click)="toggleInputMode()" [title]="richMode() ? 'Switch to plain text' : 'Switch to rich text (Markdown)'">
        @if (richMode()) {
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M1 3h3l2 6 2-6h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        } @else {
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 2h8M2 5.5h5M2 9h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        }
      </button>

      @if (!previewMode() || !richMode()) {
        <textarea
          #textarea
          class="input-textarea"
          [ngModel]="value()"
          (ngModelChange)="value.set($event)"
          (keydown)="onKeydown($event)"
          (input)="onInput()"
          (focus)="isFocused.set(true)"
          (blur)="isFocused.set(false)"
          [placeholder]="'chat.placeholder' | translate"
          rows="1"
        ></textarea>
      } @else {
        <div class="input-preview" [innerHTML]="previewHtml()"></div>
      }

      <button
        class="send-btn"
        type="button"
        (click)="submit()"
        [disabled]="!value().trim()"
        [title]="'chat.send' | translate"
      >
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14.5 1.5L1 6l5 2.5 2.5 5L14.5 1.5Z" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <!-- Hint row -->
    <div class="input-footer">
      @if (richMode()) {
        <span class="input-hint">
          <span class="hint-badge">MD</span>
          Markdown · Enter to send · Shift+Enter for newline
        </span>
      } @else {
        <span class="input-hint">{{ 'chat.plain_hint' | translate }}</span>
      }
    </div>

  </div>
</div>
