<div class="input-wrap">
  <div class="toolbar">
    <button type="button" class="tool-btn tool-btn--mode" (click)="toggleInputMode()">
      @if (richMode()) { {{ 'chat.input_plain' | translate }} } @else { {{ 'chat.input_rich' | translate }} }
    </button>
    @if (richMode()) {
      <button type="button" class="tool-btn" (click)="applyFormat('bold')" title="Bold" [disabled]="previewMode()">B</button>
      <button type="button" class="tool-btn" (click)="applyFormat('italic')" title="Italic" [disabled]="previewMode()"><em>I</em></button>
      <button type="button" class="tool-btn" (click)="applyFormat('code')" title="Code" [disabled]="previewMode()"></button>
      <button type="button" class="tool-btn" (click)="applyFormat('quote')" title="Quote" [disabled]="previewMode()">"</button>
      <button type="button" class="tool-btn" (click)="applyFormat('link')" title="Link" [disabled]="previewMode()">Link</button>
      <button type="button" class="tool-btn" (click)="applyFormat('ul')" title="List" [disabled]="previewMode()">List</button>
      <button type="button" class="tool-btn" (click)="applyFormat('h2')" title="Heading" [disabled]="previewMode()">H2</button>
      <button type="button" class="tool-btn tool-btn--preview" (click)="togglePreview()">
        @if (previewMode()) { {{ 'chat.write' | translate }} } @else { {{ 'chat.preview' | translate }} }
      </button>
    }
  </div>

  <div class="input-bar">
    @if (!previewMode() || !richMode()) {
      <textarea
        #textarea
        class="input-textarea"
        [ngModel]="value()"
        (ngModelChange)="value.set($event)"
        (keydown)="onKeydown($event)"
        (input)="onInput()"
        [placeholder]="'chat.placeholder' | translate"
        rows="1"
      ></textarea>
    } @else {
      <div class="input-preview" [innerHTML]="previewHtml()"></div>
    }
    <button
      class="send-btn"
      type="button"
      (click)="submit()"
      [disabled]="!value().trim()"
      [title]="'chat.send' | translate"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M14.5 1.5L1 6l5 2.5 2.5 5L14.5 1.5Z" fill="currentColor"/>
      </svg>
    </button>
  </div>
  @if (richMode()) {
    <p class="input-hint">Markdown enabled · Enter to send · Shift+Enter for new line</p>
  } @else {
    <p class="input-hint">{{ 'chat.plain_hint' | translate }}</p>
  }
</div>
