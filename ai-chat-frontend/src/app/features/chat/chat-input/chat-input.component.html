<div class="input-wrap">
  <div class="toolbar">
    <button type="button" class="tool-btn" (click)="applyFormat('bold')" title="Bold">B</button>
    <button type="button" class="tool-btn" (click)="applyFormat('italic')" title="Italic"><em>I</em></button>
    <button type="button" class="tool-btn" (click)="applyFormat('code')" title="Code">{ }</button>
    <button type="button" class="tool-btn" (click)="applyFormat('quote')" title="Quote">"</button>
    <button type="button" class="tool-btn" (click)="applyFormat('link')" title="Link">Link</button>
    <button type="button" class="tool-btn" (click)="applyFormat('ul')" title="List">List</button>
    <button type="button" class="tool-btn" (click)="applyFormat('h2')" title="Heading">H2</button>
    <button type="button" class="tool-btn tool-btn--preview" (click)="togglePreview()">
      @if (previewMode()) { {{ 'chat.write' | translate }} } @else { {{ 'chat.preview' | translate }} }
    </button>
  </div>

  <div class="input-bar">
    @if (!previewMode()) {
      <textarea
        #textarea
        class="input-textarea"
        [ngModel]="value()"
        (ngModelChange)="value.set($event)"
        (keydown)="onKeydown($event)"
        (input)="onInput()"
        [placeholder]="'chat.placeholder' | translate"
        rows="1"
      ></textarea>
    } @else {
      <div class="input-preview" [innerHTML]="previewHtml()"></div>
      <textarea #textarea class="hidden-textarea" rows="1"></textarea>
    }
    <button
      class="send-btn"
      type="button"
      (click)="submit()"
      [disabled]="!value().trim()"
      [title]="'chat.send' | translate"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M14.5 1.5L1 6l5 2.5 2.5 5L14.5 1.5Z" fill="currentColor"/>
      </svg>
    </button>
  </div>
  <p class="input-hint">Markdown enabled · Enter to send · Shift+Enter for new line</p>
</div>
