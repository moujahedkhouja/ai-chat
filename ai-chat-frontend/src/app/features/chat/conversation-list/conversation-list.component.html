<div class="conv-list">
  <!-- Toolbar: search + new chat button -->
  <div class="conv-toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 13 13" fill="none">
        <circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.3"/>
        <path d="M9 9l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <input
        class="search-input"
        type="text"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearch()"
        placeholder="Search chats..."
      />
    </div>
    <button class="new-btn" type="button" (click)="newChat.emit()" title="New chat">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Grouped conversations -->
  <div class="conv-scroll">
    @for (group of groups; track group.label) {
      <div class="group-label">{{ group.label }}</div>
      @for (conv of group.items; track conv.id) {
        <div
          class="conv-item"
          [class.active]="conv.id === activeId"
          (click)="select.emit(conv.id)"
        >
          <div class="conv-title">{{ conv.title }}</div>
          <button
            class="conv-delete"
            type="button"
            title="Delete"
            (click)="$event.stopPropagation(); delete.emit(conv.id)"
          >
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      }
    }
    @if (groups.length === 0) {
      <div class="conv-empty">
        @if (searchQuery) { No results for "{{ searchQuery }}" }
        @else { No conversations yet }
      </div>
    }
  </div>
</div>
