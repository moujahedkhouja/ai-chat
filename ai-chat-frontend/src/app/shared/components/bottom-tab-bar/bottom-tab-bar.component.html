<nav class="bottom-tab-bar">
  <a class="tab" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
    <span class="tab-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor"/>
        <rect x="11" y="2" width="7" height="7" rx="1.5" fill="currentColor"/>
        <rect x="2" y="11" width="7" height="7" rx="1.5" fill="currentColor"/>
        <rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor"/>
      </svg>
    </span>
    <span class="tab-label">Home</span>
  </a>

  <a class="tab" routerLink="/chat" routerLinkActive="active" title="AI Chat">
    <span class="tab-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M2 4A1.5 1.5 0 0 1 3.5 2.5h13A1.5 1.5 0 0 1 18 4v9A1.5 1.5 0 0 1 16.5 14.5H11l-4 3.5v-3.5H3.5A1.5 1.5 0 0 1 2 13V4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="tab-label">Chat</span>
  </a>

  <a class="tab" routerLink="/profile" routerLinkActive="active">
    <span class="tab-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="7" r="3.5" fill="currentColor"/>
        <path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="tab-label">Profile</span>
  </a>

  @if (isAdminOrModerator) {
    <a class="tab" routerLink="/users" routerLinkActive="active">
      <span class="tab-icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="7" cy="7" r="2.5" fill="currentColor"/>
          <circle cx="13" cy="7" r="2.5" fill="currentColor"/>
          <path d="M1 17c0-2.761 2.686-5 6-5s6 2.239 6 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M13 12c1.657 0 3 1.119 3 2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="tab-label">Users</span>
    </a>
  }

  <a class="tab" routerLink="/change-password" routerLinkActive="active">
    <span class="tab-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="10" cy="10" r="2.5" fill="currentColor"/>
      </svg>
    </span>
    <span class="tab-label">Settings</span>
  </a>

  <button class="tab tab-lang" type="button" (click)="langService.toggle()" [title]="langService.isArabic ? 'Switch to English' : 'التبديل إلى العربية'">
    <span class="tab-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.6"/>
        <path d="M10 2C10 2 7.5 5.5 7.5 10s2.5 8 2.5 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M10 2C10 2 12.5 5.5 12.5 10s-2.5 8-2.5 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M2 10h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="tab-label">{{ langService.isArabic ? 'EN' : 'AR' }}</span>
  </button>

  <button class="tab tab-logout" type="button" (click)="logout()">
    <span class="tab-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M7 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M13 14l3-4-3-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 10H8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="tab-label">Logout</span>
  </button>
</nav>
