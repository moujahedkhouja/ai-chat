<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar-logo">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <rect width="22" height="22" rx="6" fill="url(#sb-grad)"/>
      <rect x="5" y="5" width="5" height="5" rx="1.5" fill="white"/>
      <rect x="12" y="5" width="5" height="5" rx="1.5" fill="white" opacity="0.7"/>
      <rect x="5" y="12" width="5" height="5" rx="1.5" fill="white" opacity="0.7"/>
      <rect x="12" y="12" width="5" height="5" rx="1.5" fill="white" opacity="0.4"/>
      <defs>
        <linearGradient id="sb-grad" x1="0" y1="0" x2="22" y2="22">
          <stop stop-color="#009e84"/>
          <stop offset="1" stop-color="#33d9bd"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" [title]="'nav.dashboard' | translate">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <rect x="1.5" y="1.5" width="6" height="6" rx="1.5" fill="currentColor"/>
        <rect x="10.5" y="1.5" width="6" height="6" rx="1.5" fill="currentColor"/>
        <rect x="1.5" y="10.5" width="6" height="6" rx="1.5" fill="currentColor"/>
        <rect x="10.5" y="10.5" width="6" height="6" rx="1.5" fill="currentColor"/>
      </svg>
    </a>

    <a class="nav-item" routerLink="/chat" routerLinkActive="active" [title]="'nav.chat' | translate">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h11A1.5 1.5 0 0 1 16 3.5v8A1.5 1.5 0 0 1 14.5 13H10l-3.5 3v-3H3.5A1.5 1.5 0 0 1 2 11.5v-8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </a>

    @if (isAdminOrModerator) {
      <a class="nav-item" routerLink="/users" routerLinkActive="active" [title]="'nav.users' | translate">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="6.5" cy="6" r="2.5" fill="currentColor"/>
          <circle cx="11.5" cy="6" r="2.5" fill="currentColor"/>
          <path d="M1 16c0-2.761 2.462-4.5 5.5-4.5s5.5 1.739 5.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M12 11.5c1.933 0 3.5 1.119 3.5 2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </a>
    }
  </nav>

  <!-- Avatar + logout at bottom -->
  <div class="sidebar-footer">
    <!-- Language toggle -->
    <button
      class="lang-btn"
      type="button"
      (click)="langService.toggle()"
      [title]="langService.isArabic ? 'Switch to English' : 'التبديل إلى العربية'"
    >
      <span class="lang-label">{{ langService.isArabic ? 'EN' : 'AR' }}</span>
    </button>

    <button
      class="theme-btn"
      type="button"
      (click)="themeService.toggle()"
      [title]="themeService.isDark ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      @if (themeService.isDark) {
        <!-- Sun icon -->
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="3" fill="currentColor"/>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.42 1.42M11.53 11.53l1.42 1.42M3.05 12.95l1.42-1.42M11.53 4.47l1.42-1.42" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      } @else {
        <!-- Moon icon -->
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M13.5 9A6 6 0 0 1 7 2.5a6 6 0 1 0 6.5 6.5Z" fill="currentColor"/>
        </svg>
      }
    </button>
    <a class="avatar-btn" routerLink="/profile" [title]="username + ' · ' + role">
      @if (avatarUrl) {
        <img [src]="avatarUrl" [alt]="username" class="sidebar-avatar">
      } @else {
        <span class="avatar-initials">{{ username.charAt(0).toUpperCase() }}</span>
      }
    </a>
  </div>
</aside>
