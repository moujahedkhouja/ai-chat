spring.application.name=ai-chat

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/aichat
spring.datasource.username=aichat
spring.datasource.password=${DB_PASSWORD:aichat_dev}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Avatar upload
app.upload.avatar-dir=./uploads/avatars
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Spring AI — LM Studio (OpenAI-compatible local server)
# LM Studio runs on http://localhost:1234 by default.
# Set LMSTUDIO_MODEL env var to the model identifier shown in LM Studio, e.g. "llama-3.2-3b-instruct"
spring.ai.openai.base-url=${LMSTUDIO_BASE_URL:http://localhost:1234}
spring.ai.openai.api-key=lm-studio
spring.ai.openai.chat.options.model=${LMSTUDIO_MODEL:llama-3.2-3b-instruct}
spring.ai.openai.chat.options.temperature=0.7

